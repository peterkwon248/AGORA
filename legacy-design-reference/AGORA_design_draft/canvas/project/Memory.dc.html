<div style="width: 412px; height: 915px; overflow: hidden">

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"language": {"editor": "enum", "options": ["한국어", "English"], "default": "한국어", "section": "보기"}, "theme": {"editor": "enum", "options": ["시스템", "라이트", "다크"], "default": "시스템", "section": "보기"}, "$preview": {"width": 412, "height": 915}}'>
class Component extends DCLogic {
  renderVals() {
    return { language: this.props.language ?? '한국어', theme: this.props.theme ?? '시스템' };
  }
}
</script>
