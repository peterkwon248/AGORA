
<sc-if value="{{ hasOb }}" hint-placeholder-val="{{ false }}">
<section aria-label="⟦처음 안내¦Welcome⟧" style="position: absolute; inset: 0; z-index: 400; padding: 16px 24px 28px; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; animation: agFade 0.2s ease-out;">
  <div style="display: flex; justify-content: flex-end; flex: none;"><button onClick="{{ fn.obSkip }}" style="height: 44px; padding: 0 8px; border: 0; background: transparent; color: var(--ink3); font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;">⟦건너뛰기¦Skip⟧</button></div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px;">
    <sc-if value="{{ ob.isFirst }}"><span style="font-size: 34px; font-weight: 800; letter-spacing: 0.22em; display: inline-flex; align-items: center;" aria-label="AGORA">AG<span style="width: 22px; height: 22px; border-radius: 50%; background: var(--lamp); display: inline-block; margin: 0 0.22em 0 0.02em;"></span>RA</span></sc-if>
    <sc-if value="{{ ob.isMid }}">
      <span style="display: flex; padding-left: 4px;" aria-hidden="true">
        <img src="/_blob/5d0e39a976cd27ba0c182884b28405df" alt="" style="width: 64px; height: 64px; border-radius: 50%; object-fit: cover; filter: grayscale(1) contrast(1.06); background: var(--sunken); box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--so);">
        <img src="/_blob/7cd6b76182321c6d5c5922ddec00c1ca" alt="" style="width: 64px; height: 64px; margin-left: -10px; border-radius: 50%; object-fit: cover; filter: grayscale(1) contrast(1.06); background: var(--sunken); box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ni);">
        <img src="/_blob/ad60c4638819dddb9854296103adaa9e" alt="" style="width: 64px; height: 64px; margin-left: -10px; border-radius: 50%; object-fit: cover; filter: grayscale(1) contrast(1.06); background: var(--sunken); box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ca);">
      </span>
      <span style="align-self: flex-start; height: 26px; padding: 0 10px; border-radius: 999px; background: var(--sunken); color: var(--ink2); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center;">⟦AI 시뮬레이션¦AI simulation⟧</span>
    </sc-if>
    <sc-if value="{{ ob.isLast }}"><span style="width: 72px; height: 72px; border-radius: 24px; background: var(--psoft); color: var(--pink); display: flex; align-items: center; justify-content: center;" aria-hidden="true">[[i|lock|34|1.8]]</span></sc-if>
    <h1 style="margin: 0; font-family: 'Gowun Batang', serif; font-size: 28px; line-height: 38px; font-weight: 700;">{{ ob.title }}</h1>
    <p style="margin: 0; font-size: 15.5px; line-height: 25px; color: var(--ink2);">{{ ob.body }}</p>
  </div>
  <div style="display: flex; gap: 6px; justify-content: center; margin-bottom: 20px; flex: none;" aria-hidden="true"><sc-for list="{{ ob.dots }}" as="od" hint-placeholder-count="3"><span style="height: 8px; border-radius: 999px; transition: width 0.2s ease; {{ od.style }}"></span></sc-for></div>
  <button onClick="{{ fn.obNext }}" style="width: 100%; height: 54px; flex: none; border: 0; border-radius: 999px; background: var(--primary); color: var(--onprimary); font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer;">{{ ob.next }}</button>
</section>
</sc-if>
