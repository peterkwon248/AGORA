
[[screen|pick|pick|{{ pick.title }}]]
  [[hdr|{{ pick.title }}]]
  [[scroll]]
    <div style="padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 10px;">
      <p style="margin: 0; padding: 10px 12px; border-radius: 14px; background: var(--sunken); font-size: 12px; line-height: 18px; color: var(--ink2); display: flex; gap: 8px;">[[i|info2|15|2|flex: none; margin-top: 2px;]]<span>{{ pick.note }}</span></p>
      <sc-for list="{{ pick.rows }}" as="pr" hint-placeholder-count="6">
        <button aria-pressed="{{ pr.on }}" disabled="{{ pr.fixed }}" onClick="{{ pr.toggle }}" style="width: 100%; padding: 10px 14px; border: 0; border-radius: 20px; background: var(--surface); font-family: inherit; color: inherit; text-align: left; display: flex; align-items: center; gap: 14px; cursor: pointer; {{ pr.card }}">
          [[av|pr.av|52|3.5|var(--surface)|]]
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;"><strong style="font-size: 16px; line-height: 22px; color: {{ pr.hue }};">{{ pr.name }}</strong><span style="font-size: 11px; color: var(--ink3);">{{ pr.years }}</span></span>
            <span style="font-size: 13px; line-height: 19px; color: var(--ink2);">{{ pr.sub }}</span>
          </span>
          [[checkbox|pr]]
        </button>
      </sc-for>
    </div>
  [[/scroll]]
  <div style="flex: none; padding: 10px 16px 20px; background: var(--bg); box-shadow: inset 0 1px 0 var(--line);">
    [[primary|fn.pickConfirm|{{ pick.label }}|pick.cantConfirm|pick.confirmStyle]]
  </div>
[[/screen]]
