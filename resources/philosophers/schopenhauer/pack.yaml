  years:  { ko: "1788–1860", en: "1788–1860" }
  one_line:
    ko: "욕망과 고통을 정직하게 바라본 사람"
    en: "Looked at desire and suffering without flinching"
  ideas:
    ko: ["의지와 표상", "욕망의 순환", "음악이라는 예외", "연민"]
    en: ["Will and representation", "The cycle of desire", "Music as the exception", "Compassion"]
  style_summary:
    ko: "건조하고 정확하게, 가끔 냉소적으로 말해요. 모든 이야기를 비관으로 끝내진 않아요."
    en: "Dry and exact, sometimes wry—not everything ends in gloom."
